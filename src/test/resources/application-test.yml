spring:
  datasource:
    url: jdbc:h2:mem:testdb  # 메모리 기반 H2
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop   # 실행 시 생성, 종료 시 제거
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379


jwt:
  access_token:
      valid_time: 3600000
  refresh_token:
      valid_time: 36000000
  secret_key: "mySuperSecretJwtKey12345"

cloud:
  aws:
    s3:
      bucket-name: dummy-bucket-name
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
    region:
      static: dummy-region
external:
  api:
    image-analysis-url: "http://dummy-image-analysis-api.local"
logging:
  level:
    DEBUG: